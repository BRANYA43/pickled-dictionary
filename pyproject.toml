[project]
name = "pickled-dictionary"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "httpx>=0.28.1",
    "kivy>=2.3.1",
    "kivymd",
    "loguru>=0.7.3",
    "peewee>=4.0.0",
    "peewee-migrate>=1.6.6",
    "pydantic>=2.12.5",
]

[tool.uv.sources]
kivymd = { url = "https://github.com/kivymd/KivyMD/archive/master.zip" }

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pre-commit>=4.5.1",
    "pyinstaller>=6.19.0",
    "pytest>=9.0.2",
]
